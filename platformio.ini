; LilyGO T-Watch 2019 Touch 配置
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = default_16MB.csv
; 16MB Flash，8MB PSRAM
board_build.flash_size = 16MB
board_build.psram_size = 8MB
build_src_filter = +<*> +<buddies/>
lib_deps =
    h2zero/NimBLE-Arduino @ ^2.2.0
    bodmer/TFT_eSPI @ ^2.5.43
    lewisxhe/XPowersLib@^0.3.3
    lewisxhe/SensorLib@^0.4.1
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0

[env:twatch2019]
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM=1
    -mfix-esp32-psram-cache-issue
    ; TFT_eSPI 驱动配置：ST7789，240x240
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=19
    -DTFT_SCLK=18
    -DTFT_DC=27
    -DTFT_CS=5
    -DTFT_BL=12
    -DTFT_RST=-1
    -DSPI_FREQUENCY=40000000
    ; 加载 GLCD、FONT2、GFXFF 字体
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_GFXFF=1

; 仅限分叉的 CJK 简体中文渲染构建变体。
; 向应用二进制文件增加约 120 KB（GB2312 一级字表，3760 字）。
; ASCII 仍在 drawHUD 之外使用 5x7 GFX 字体；drawHUD 内切换为
; ASC16（8x16）+ GB2312_L1（16x16），使混合脚本行共享 16px 基线。
; 不向上游提交 PR——参见父仓库 CONTRIBUTING："we won't take new features"。
[env:twatch2019-cjk-zh-cn]
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM=1
    -mfix-esp32-psram-cache-issue
    -DCC_BUDDY_CJK_DISPLAY=1
    ; TFT_eSPI 驱动配置：ST7789，240x240
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=19
    -DTFT_SCLK=18
    -DTFT_DC=27
    -DTFT_CS=5
    -DTFT_BL=12
    -DTFT_RST=-1
    -DSPI_FREQUENCY=40000000
    ; 加载 GLCD、FONT2、GFXFF 字体
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_GFXFF=1
